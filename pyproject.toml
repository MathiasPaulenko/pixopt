[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixopt"
version = "1.1.1"
description = "Fast Python image optimizer. Resize, compress, convert, and generate responsive assets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Mathias Paulenko Echeverz", email = "mathias.paulenko@outlook.com"}
]
keywords = ["image", "optimization", "compression", "webp", "jpeg", "png", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "Pillow>=12.3.0",
    "pillow-heif>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "piexif>=1.1.3",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
pdf = [
    "PyMuPDF>=1.23.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pyright>=1.1.0",
    "bandit>=1.7.0",
    "pip-audit>=2.0.0",
    "python-semantic-release>=9.0.0",
    "PyMuPDF>=1.23.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.scripts]
pixopt = "pixopt.cli:app"

[project.urls]
Homepage = "https://github.com/MathiasPaulenko/pixopt"
Repository = "https://github.com/MathiasPaulenko/pixopt"
Documentation = "https://mathiaspaulenko.github.io/pixopt/"
Changelog = "https://github.com/MathiasPaulenko/pixopt/blob/main/CHANGELOG.md"
Issues = "https://github.com/MathiasPaulenko/pixopt/issues"

[tool.hatch.build.targets.wheel]
packages = ["pixopt"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"pixopt/html_comparison.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["piexif", "fitz"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["pixopt"]

[tool.coverage.html]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["pixopt/__init__.py:__version__"]
build_command = "python -m build"
upload_to_pypi = false
upload_to_release = false
vcs_release = false
commit_author = "github-actions <actions@github.com>"
commit_message = "chore(release): bump version to {{version}} [skip ci]"

[tool.semantic_release.branches.main]
match = "main"
